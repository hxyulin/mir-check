[package]
name = "mir-check"
description = "Experimental Rust MIR analysis for panic freedom and function contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
syn.workspace = true

[dev-dependencies]
mir-contracts = { path = "../mir-contracts" }
quote.workspace = true

[[bin]]
name = "mir-check"
path = "src/main.rs"

[[bin]]
name = "cargo-mir-check"
path = "src/cargo.rs"
